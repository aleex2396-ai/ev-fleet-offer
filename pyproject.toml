[project]
name = "fleetoffer"
version = "0.1.0.dev0"
description = "A fleet charging offer from learned per-car bounds, calibrated by day and scored by replayed delivery, on open EV charging data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Weixuan Lu" }]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.scripts]
fleetoffer = "fleetoffer.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
